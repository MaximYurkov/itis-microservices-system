events {}

http {
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=5r/s;

    upstream task_service_upstream {
        least_conn;
        server task-service:8001;
        # Для демонстрации балансировки можно добавить второй экземпляр при масштабировании.
        # server task-service-2:8001;
    }

    upstream notification_service_upstream {
        least_conn;
        server notification-service:8003;
    }

    server {
        listen 8080;
        client_max_body_size 2m;

        location /tasks {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://task_service_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /notifications {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://notification_service_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /health {
            access_log off;
            return 200 'gateway ok';
            add_header Content-Type text/plain;
        }
    }
}
