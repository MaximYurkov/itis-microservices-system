version: "3.9"

services:
  kafka:
    image: bitnami/kafka:3.7
    container_name: kafka
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_CFG_NODE_ID: 0
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      ALLOW_PLAINTEXT_LISTENER: "yes"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tasks_db}
      POSTGRES_USER: ${POSTGRES_USER:-tasks_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tasks_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "${REDIS_PORT:-6379}:6379"

  mongo:
    image: mongo:7
    container_name: mongo
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db

  task-service:
    build:
      context: .
      dockerfile: services/task_service/Dockerfile
    container_name: task-service
    environment:
      SERVICE_NAME: task-service
      APP_PORT: 8001
      DATABASE_URL: postgresql+psycopg://tasks_user:tasks_password@postgres:5432/tasks_db
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      TASK_CREATED_TOPIC: task.created
      TASK_COMPLETED_TOPIC: task.completed
    depends_on:
      - postgres
      - kafka
    ports:
      - "8001:8001"

  agent-service:
    build:
      context: .
      dockerfile: services/agent_service/Dockerfile
    container_name: agent-service
    environment:
      SERVICE_NAME: agent-service
      APP_PORT: 8002
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      TASK_CREATED_TOPIC: task.created
      TASK_COMPLETED_TOPIC: task.completed
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - kafka
      - redis
    ports:
      - "8002:8002"

  notification-service:
    build:
      context: .
      dockerfile: services/notification_service/Dockerfile
    container_name: notification-service
    environment:
      SERVICE_NAME: notification-service
      APP_PORT: 8003
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      TASK_COMPLETED_TOPIC: task.completed
      MONGO_URL: mongodb://mongo:27017
      MONGO_DB: notifications_db
      MONGO_COLLECTION: notifications
    depends_on:
      - kafka
      - mongo
    ports:
      - "8003:8003"

  gateway:
    image: nginx:1.27-alpine
    container_name: gateway
    depends_on:
      - task-service
      - notification-service
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  postgres_data:
  mongo_data:
