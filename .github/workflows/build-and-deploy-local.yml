name: build-and-deploy-local

on:
  workflow_dispatch:
  push:
    branches:
      - feature/block2-infra
    paths:
      - "services/**"
      - ".github/workflows/build-and-deploy-local.yml"

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check local registry
        shell: powershell
        run: |
          curl.exe http://localhost:5000/v2/_catalog

      - name: Set image tag
        shell: powershell
        run: |
          "IMAGE_TAG=$env:GITHUB_SHA" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build and push task-service
        shell: powershell
        run: |
          docker build -t localhost:5000/task-service:$env:IMAGE_TAG -f services/task_service/Dockerfile .
          docker push localhost:5000/task-service:$env:IMAGE_TAG

      - name: Build and push agent-service
        shell: powershell
        run: |
          docker build -t localhost:5000/agent-service:$env:IMAGE_TAG -f services/agent_service/Dockerfile .
          docker push localhost:5000/agent-service:$env:IMAGE_TAG

      - name: Build and push notification-service
        shell: powershell
        run: |
          docker build -t localhost:5000/notification-service:$env:IMAGE_TAG -f services/notification_service/Dockerfile .
          docker push localhost:5000/notification-service:$env:IMAGE_TAG

      - name: Update Helm image tags
        shell: powershell
        run: |
          $tag = $env:IMAGE_TAG
          $files = @(
            "infra/helm/task-service/values.yaml",
            "infra/helm/agent-service/values.yaml",
            "infra/helm/notification-service/values.yaml"
          )

          foreach ($file in $files) {
            $content = Get-Content $file -Raw
            $content = $content -replace 'tag:\s*"?[^"\r\n]+"?', "tag: `"$tag`""
            Set-Content -Path $file -Value $content
          }

      - name: Commit and push updated Helm values
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add infra/helm

          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "No changes to commit"
          } else {
            git commit -m "ci: update image tags to $env:IMAGE_TAG"
            git push origin HEAD:feature/block2-infra
          }