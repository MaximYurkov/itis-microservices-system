nameOverride: task-service
namespace: content-moderation

image:
  repository: localhost:5000/task-service
  tag: latest
  pullPolicy: Always

serviceAccount:
  name: task-service-sa

service:
  type: ClusterIP
  port: 8001
  targetPort: 8001

containerPort: 8001

env:
  SERVICE_NAME: task-service
  APP_PORT: "8001"
  DATABASE_URL: "postgresql+psycopg://tasks_user:tasks_password@postgres:5432/tasks_db"
  KAFKA_BOOTSTRAP_SERVERS: "my-cluster-kafka-bootstrap.kafka.svc.cluster.local:9092"
  TASK_CREATED_TOPIC: "content.created"
  TASK_COMPLETED_TOPIC: "content.moderated"