nameOverride: agent-service
namespace: content-moderation

image:
  repository: localhost:5000/agent-service
  tag: "4ebcffd06d0f4c8d4856af8c9a8b7931771fa87a"
  pullPolicy: Always

serviceAccount:
  name: agent-service-sa

service:
  type: ClusterIP
  port: 8002
  targetPort: 8002

containerPort: 8002

env:
  SERVICE_NAME: agent-service
  APP_PORT: "8002"
  KAFKA_BOOTSTRAP_SERVERS: "my-cluster-kafka-bootstrap.kafka.svc.cluster.local:9092"
  TASK_CREATED_TOPIC: "content.created"
  TASK_COMPLETED_TOPIC: "content.moderated"
  REDIS_URL: "redis://redis:6379/0"
