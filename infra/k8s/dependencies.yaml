apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: content-moderation
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: tasks_db
            - name: POSTGRES_USER
              value: tasks_user
            - name: POSTGRES_PASSWORD
              value: tasks_password
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: content-moderation
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: content-moderation
spec:
  replicas: 1
