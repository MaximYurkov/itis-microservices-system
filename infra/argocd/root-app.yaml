apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: content-moderation-root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/MaximYurkov/itis-microservices-system.git
    targetRevision: feature/block2-infra
    path: infra/argocd/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true