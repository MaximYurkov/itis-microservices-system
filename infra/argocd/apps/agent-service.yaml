apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: agent-service
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/MaximYurkov/itis-microservices-system.git
    targetRevision: feature/block2-infra
    path: infra/helm/agent-service
  destination:
    server: https://kubernetes.default.svc
    namespace: content-moderation
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true